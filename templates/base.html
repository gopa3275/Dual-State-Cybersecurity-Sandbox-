<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CyberSandbox Studio{% endblock %}</title>
    
    <!-- Tailwind CSS (via CDN for simplicity in this example) -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Shared Styles & Fonts -->
    {% include 'components/styles.html' %}
    <!-- Prism.js syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" integrity="" crossorigin="anonymous" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-diff.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js" integrity="" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-http.min.js" integrity="" crossorigin="anonymous"></script>
    <script>
        // Expose a simple helper to re-run Prism highlighting after dynamic DOM updates
        function highlightCode() {
            try {
                if (window.Prism && typeof Prism.highlightAll === 'function') {
                    Prism.highlightAll();
                }
            } catch (e) {
                console.error('Prism highlight failed', e);
            }
        }
    </script>
</head>
<body class="bg-[var(--bg-primary)] text-[var(--text-color)] font-sans transition-colors duration-300">

    <div class="mx-auto w-full px-4 py-4 max-w-[1440px]">
        <!-- Sticky Header with Navbar -->
        <header class="sticky top-4 z-50 mb-4">
            {% include 'components/navbar.html' %}
        </header>

        <!-- Feature Navigation Tabs -->
        {% include 'components/nav_tabs.html' %}

        <!-- Main Content Area: single-column on small, two-column on desktop (>=1024px) -->
        <main class="mt-4">
            <div class="w-full grid grid-cols-1 lg:grid-cols-[minmax(0,1fr)_420px] gap-6">
                <!-- Left: module content (form controls, inputs) -->
                <section class="left-column">
                    {% block content %}{% endblock %}
                </section>

                <!-- Right: live logs and telemetry (visible on lg+) -->
                <aside id="right-rail" class="hidden lg:block">
                    <div class="glass-card p-4 rounded-xl border border-[var(--border-color)] sticky top-20 space-y-4">
                        <h3 class="text-sm text-[var(--text-muted)] uppercase tracking-wider">Live Logs</h3>
                        <div id="liveLogs" class="w-full bg-[var(--bg-secondary)] border border-[var(--border-color)] p-3 rounded-lg min-h-[200px] max-h-[60vh] overflow-auto font-mono text-xs text-[var(--text-muted)]">No logs yet...</div>

                        <h3 class="text-sm text-[var(--text-muted)] uppercase tracking-wider">Telemetry</h3>
                        <div class="flex flex-col gap-2 text-sm">
                            <div class="flex justify-between"><span class="text-[var(--text-muted)]">Blocked</span><span id="sidebar_attacks_blocked" class="font-mono text-emerald-400">0</span></div>
                            <div class="flex justify-between"><span class="text-[var(--text-muted)]">Exploited</span><span id="sidebar_flaws_exploited" class="font-mono text-rose-400">0</span></div>
                            <div class="flex justify-between"><span class="text-[var(--text-muted)]">Threats</span><span id="sidebar_threats_spotted" class="font-mono text-amber-400">0</span></div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button onclick="document.getElementById('liveLogs').innerText = ''" class="btn text-sm py-1 px-2">Clear Logs</button>
                            <button onclick="copyToClipboard('liveLogs')" class="btn text-sm py-1 px-2">Copy Logs</button>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>

    <!-- Global Scripts -->
    <script>
        let isSecurityOn = false; // Default to VULNERABLE
        let currentMetrics = { attacks_blocked: 0, flaws_exploited: 0, threats_spotted: 0 };
        const themeIcons = {
            dark: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" /></svg>`,
            light: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z" clip-rule="evenodd" /></svg>`,
            textured: `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" /></svg>`
        };

        function updateThemeButton(theme) {
            const btn = document.getElementById('themeToggleBtn');
            if (!btn) return;
            // The icon shown should represent the *next* theme in the cycle
            if (theme === 'dark') btn.innerHTML = themeIcons.light; // next is light
            else if (theme === 'light') btn.innerHTML = themeIcons.textured; // next is textured
            else btn.innerHTML = themeIcons.dark; // next is dark
        }

        // Theme Switching Logic
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme') || 'dark';
            let nextTheme = 'light';
            if (currentTheme === 'light') nextTheme = 'textured';
            else if (currentTheme === 'textured') nextTheme = 'dark';
            
            html.setAttribute('data-theme', nextTheme);
            localStorage.setItem('theme', nextTheme);
            updateThemeButton(nextTheme);

            // Synchronize with Tailwind's dark mode class
            if (nextTheme === 'light') {
                html.classList.remove('dark');
            } else {
                html.classList.add('dark');
            }
        }

        // Security Mode Toggle Logic
        async function toggleSecurityMode() {
            const res = await fetch('/api/security_mode', { method: 'POST' });
            const data = await res.json();
            // Server returns unified key 'security_on'
            isSecurityOn = data.security_on;
            updateSecurityButton();
        }

        function updateSecurityButton() {
            const btn = document.getElementById('secToggleBtn');
            const icon = document.getElementById('secIcon');
            const text = document.getElementById('secText');
            if (!btn || !icon || !text) return;

            const lockedIcon = `<path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />`;
            const unlockedIcon = `<path d="M10 2a5 5 0 00-5 5v2a2 2 0 00-2 2v5a2 2 0 002 2h10a2 2 0 002-2v-5a2 2 0 00-2-2H7V7a3 3 0 015.905-.905 1 1 0 001.937-.5A5.002 5.002 0 0010 2z" />`;

            if (isSecurityOn) {
                btn.className = 'btn badge-secure flex items-center gap-2';
                icon.innerHTML = lockedIcon;
                text.textContent = 'Secure';
            } else {
                btn.className = 'btn badge-vuln flex items-center gap-2';
                icon.innerHTML = unlockedIcon;
                text.textContent = 'Vulnerable';
            }
        }
        
        // Fetch and update telemetry counters
        async function fetchMetrics() {
            try {
                const res = await fetch('/api/metrics');
                if (!res.ok) throw new Error(`API Error: ${res.status}`);
                const data = await res.json();
                applyTelemetryPayload(data);
            } catch (error) {
                console.error("Failed to fetch metrics:", error);
            }
        }

        // Apply telemetry object to UI (top bar, sidebar) and update currentMetrics
        function applyTelemetryPayload(data) {
            if (!data) return;
            const blockedEl = document.getElementById('attacks_blocked');
            const exploitedEl = document.getElementById('flaws_exploited');
            const spottedEl = document.getElementById('threats_spotted');

            const sBlockedEl = document.getElementById('sidebar_attacks_blocked');
            const sExploitedEl = document.getElementById('sidebar_flaws_exploited');
            const sSpottedEl = document.getElementById('sidebar_threats_spotted');

            // Flash logic comparing to currentMetrics
            try {
                if (blockedEl && data.attacks_blocked > (currentMetrics.attacks_blocked || 0)) {
                    if (blockedEl.parentElement) blockedEl.parentElement.classList.remove('flash-green');
                    void blockedEl.offsetWidth;
                    if (blockedEl.parentElement) blockedEl.parentElement.classList.add('flash-green');
                }
                if (exploitedEl && data.flaws_exploited > (currentMetrics.flaws_exploited || 0)) {
                    if (exploitedEl.parentElement) exploitedEl.parentElement.classList.remove('flash-red');
                    if (exploitedEl.offsetWidth !== undefined) void exploitedEl.offsetWidth;
                    if (exploitedEl.parentElement) exploitedEl.parentElement.classList.add('flash-red');
                }
                if (spottedEl && data.threats_spotted > (currentMetrics.threats_spotted || 0)) {
                    if (spottedEl.parentElement) spottedEl.parentElement.classList.remove('flash-amber');
                    if (spottedEl.offsetWidth !== undefined) void spottedEl.offsetWidth;
                    if (spottedEl.parentElement) spottedEl.parentElement.classList.add('flash-amber');
                }
            } catch (e) {
                // ignore DOM issues
            }

            if (blockedEl) blockedEl.textContent = data.attacks_blocked ?? 0;
            if (exploitedEl) exploitedEl.textContent = data.flaws_exploited ?? 0;
            if (spottedEl) spottedEl.textContent = data.threats_spotted ?? 0;

            if (sBlockedEl) sBlockedEl.textContent = data.attacks_blocked ?? 0;
            if (sExploitedEl) sExploitedEl.textContent = data.flaws_exploited ?? 0;
            if (sSpottedEl) sSpottedEl.textContent = data.threats_spotted ?? 0;

            // Update local snapshot
            currentMetrics = {
                attacks_blocked: data.attacks_blocked ?? 0,
                flaws_exploited: data.flaws_exploited ?? 0,
                threats_spotted: data.threats_spotted ?? 0
            };
        }

        // Append a short line to the live logs panel (if present)
        function appendLiveLog(message) {
            try {
                const el = document.getElementById('liveLogs');
                if (!el) return;
                const now = new Date();
                const ts = now.toISOString();
                // Prepend new messages so latest appear on top
                el.innerText = `[${ts}] ${message}\n` + el.innerText;
                // Trim if too large
                if (el.innerText.length > 20000) el.innerText = el.innerText.substring(0, 20000);
            } catch (e) {
                /* ignore */
            }
        }

        // Reset All Progress
        async function resetAllProgress() {
            if (!confirm("Are you sure you want to reset all progress? This will clear your entire session, including telemetry, captured flags, and security mode.")) {
                return;
            }
            try {
                const res = await fetch('/api/reset_all', { method: 'POST' });
                if (res.ok) {
                    // Reload the page for a completely fresh start
                    window.location.reload();
                } else {
                    alert('Failed to reset progress. Please try again.');
                }
            } catch (error) {
                alert(`An error occurred: ${error.message}`);
            }
        }

        // Global utility to copy text from an element with feedback and fallback support
        // Usage: copyToClipboard('elementId', thisButtonElement)
        function copyToClipboard(elementId, btn) {
            const el = document.getElementById(elementId);
            const text = el ? (el.innerText || el.textContent || '') : '';

            function setAriaMessage(msg) {
                try {
                    const aria = document.getElementById('ariaLive');
                    if (aria) aria.textContent = msg;
                } catch (e) {
                    // ignore
                }
            }

            function showFeedback(button) {
                if (!button) return;
                try {
                    if (!button.dataset.origHtml) button.dataset.origHtml = button.innerHTML;
                    button.innerHTML = '<span class="px-2 py-0.5 rounded text-white" style="background-color:#16a34a">Copied!</span>';
                    button.classList.add('ring-2','ring-green-300');
                    setAriaMessage('Copied to clipboard');
                    setTimeout(() => {
                        button.innerHTML = button.dataset.origHtml;
                        button.classList.remove('ring-2','ring-green-300');
                        delete button.dataset.origHtml;
                        setAriaMessage('');
                    }, 1500);
                } catch (e) {
                    // ignore UI feedback errors
                }
            }

            function fallbackCopy() {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showFeedback(btn);
                } catch (e) {
                    if (btn) btn.innerText = 'Copy failed';
                    setAriaMessage('Copy failed');
                    console.error('Fallback copy failed', e);
                }
            }

            if (!text) {
                if (btn) {
                    // quick visual feedback when nothing to copy
                    const orig = btn.innerHTML;
                    btn.innerHTML = 'Nothing to copy';
                    setAriaMessage('Nothing to copy');
                    setTimeout(() => { btn.innerHTML = orig; setAriaMessage(''); }, 1200);
                }
                return;
            }

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => { showFeedback(btn); }).catch(() => { fallbackCopy(); });
            } else {
                fallbackCopy();
            }
        }

        // Initial state setup on page load
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);

            // Synchronize with Tailwind's dark mode class on initial load
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
            updateThemeButton(savedTheme);

            fetch('/api/security_mode').then(res => res.json()).then(data => {
                isSecurityOn = data.security_on;
                updateSecurityButton();
            });
            fetchMetrics();
        });
    </script>

    <!-- ARIA live region for announcements (screen-reader only) -->
    <div id="ariaLive" aria-live="polite" aria-atomic="true" class="sr-only" style="position:fixed; left:-9999px; width:1px; height:1px; overflow:hidden;"> </div>

    <!-- Page-specific Scripts -->
    {% block scripts %}{% endblock %}

</body>
</html>
