{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="glass-card p-8 md:p-12 rounded-xl border border-[var(--border-color)] mt-8 text-center">
    <h1 class="text-6xl font-bold text-[var(--accent-color)]">404</h1>
    <h2 class="text-3xl font-bold mt-4">Page Not Found</h2>
    <p class="text-[var(--text-muted)] mt-2">The page you are looking for does not exist or has been moved.</p>
    <div class="mt-8">
        <a href="{{ url_for('welcome.index') }}" class="px-6 py-3 bg-[var(--accent-color)] text-white font-semibold rounded-lg hover:opacity-90 transition-all">
            Go to Homepage
        </a>
    </div>
</div>
{% endblock %}
